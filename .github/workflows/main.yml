name: PacMan Contribution Graph
on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Pacman Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: joaonkunku01

      - name: Commit SVG to output branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Update PacMan contribution graph" || echo "No changes to commit"
          git push origin HEAD:output
