name: PacMan Contribution Graph
on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate PacMan Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: iZIer01
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}   # your personal access token

      - name: Commit SVG to output branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Update PacMan contribution graph" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/iZIer01/iZIer01.git HEAD:output
