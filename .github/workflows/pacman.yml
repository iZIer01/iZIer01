name: PacMan Contribution Graph
on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout main branch
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          ref: main

      # 2️⃣ Generate PacMan SVG
      - name: Generate PacMan Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: iZIer01
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # 3️⃣ Commit SVGs to main branch
      - name: Commit to main
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Update PacMan contribution graph" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/iZIer01/iZIer01.git HEAD:main

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_branch: gh-pages      # branch for Pages
          publish_dir: ./               # root folder has SVGs
          user_name: github-actions
          user_email: actions@github.com
